<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Labour Ward Equipment Check v2 — Stoke Mandeville</title>
<style>
:root{--blue:#003087;--blue2:#005EB8;--blue3:#0072CE;--aqua:#41B6E6;--green:#007F3B;--green2:#78BE20;--red:#DA291C;--amber:#ED8B00;--grey1:#231f20;--grey2:#425563;--grey3:#768692;--grey4:#D8DDE0;--grey5:#F0F4F5;--white:#fff;--font:'Frutiger','Arial',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--grey5);color:var(--grey1);min-height:100vh;-webkit-font-smoothing:antialiased;}
.topbar{background:var(--blue);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,0.2);}
.nhs-logo{background:white;color:var(--blue);font-weight:700;font-size:16px;padding:2px 7px;border-radius:3px;letter-spacing:-0.5px;}
.topbar-title{color:white;font-size:13px;font-weight:600;text-align:center;line-height:1.3;}
.topbar-time{color:var(--aqua);font-size:12px;text-align:right;min-width:50px;}
.screen{display:none;}.screen.active{display:block;}

/* STAFF SCREEN */
.staff-wrap{padding:20px 16px;}
.equip-hero{background:white;border-radius:10px;overflow:hidden;margin-bottom:20px;border:1px solid var(--grey4);}
.equip-hero-img{width:100%;height:200px;background:var(--grey4);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.equip-hero-img img{width:100%;height:100%;object-fit:cover;}
.equip-hero-placeholder{text-align:center;color:var(--grey3);}
.equip-hero-placeholder div{font-size:52px;margin-bottom:8px;}
.equip-hero-info{padding:14px 16px;}
.equip-hero-info h2{font-size:19px;font-weight:700;color:var(--grey1);margin-bottom:4px;}
.equip-hero-info p{font-size:13px;color:var(--grey2);}
.freq-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.freq-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;text-transform:uppercase;letter-spacing:0.3px;}
.fp-daily{background:#E8F4F9;color:#0072CE;}
.fp-weekly{background:#FEF3E2;color:#ED8B00;}
.fp-monthly{background:#E8F4EE;color:#007F3B;}
.fp-emergency{background:#FDECEA;color:#DA291C;}
.last-check-box{background:white;border-radius:8px;border:1px solid var(--grey4);padding:12px 14px;margin-bottom:18px;font-size:13px;color:var(--grey2);}
.last-check-box strong{color:var(--grey1);display:block;margin-bottom:2px;font-size:14px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--grey2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
.form-input{width:100%;border:2px solid var(--grey4);border-radius:8px;padding:13px 14px;font-size:16px;font-family:var(--font);color:var(--grey1);background:white;transition:border-color 0.2s;}
.form-input:focus{outline:none;border-color:var(--blue3);}
.start-btn{width:100%;background:var(--blue);color:white;border:none;padding:16px;font-size:17px;font-weight:700;border-radius:8px;cursor:pointer;margin-top:4px;}
.start-btn:disabled{background:var(--grey3);cursor:not-allowed;}
.emergency-btn{width:100%;background:var(--red);color:white;border:none;padding:13px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;margin-top:10px;}
.config-notice{background:#FEF3E2;border:1px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--grey2);}
.config-notice strong{color:var(--amber);display:block;margin-bottom:3px;}

/* CHECKLIST */
.check-header{background:var(--blue);color:white;padding:14px 16px;}
.check-header h2{font-size:17px;font-weight:700;margin-bottom:3px;}
.check-header p{font-size:13px;opacity:0.8;margin-bottom:10px;}
.progress-wrap{background:rgba(255,255,255,0.2);border-radius:4px;height:5px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green2);border-radius:4px;transition:width 0.3s;}
.progress-text{font-size:12px;color:rgba(255,255,255,0.8);margin-top:4px;}
.main-img-section{background:white;border-bottom:2px solid var(--blue);}
.main-img-wrap{width:100%;height:200px;background:var(--grey4);overflow:hidden;position:relative;}
.main-img-wrap img{width:100%;height:100%;object-fit:cover;}
.img-caption-bar{padding:8px 14px;background:white;border-bottom:1px solid var(--grey4);}
.img-caption-bar p{font-size:13px;color:var(--grey2);font-style:italic;}
.checks-body{padding-bottom:130px;}
.cat-header{background:var(--blue2);color:white;padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:8px;}
.cat-icon{width:22px;height:22px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}

/* ITEM ROW WITH IMAGE */
.item-wrap{background:white;border-bottom:1px solid var(--grey4);}
.item-wrap.critical{border-left:4px solid var(--red);}
.item-row{padding:12px 16px;display:flex;align-items:flex-start;gap:10px;}
.item-img-thumb{width:56px;height:56px;border-radius:8px;background:var(--grey4);flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;}
.item-img-thumb img{width:100%;height:100%;object-fit:cover;}
.item-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--grey3);}
.item-img-expand{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,0.5);color:white;font-size:9px;padding:1px 4px;border-radius:3px;}
.item-text{flex:1;}
.item-name{font-size:14px;font-weight:600;margin-bottom:2px;color:var(--grey1);}
.item-desc{font-size:12px;color:var(--grey3);line-height:1.4;}
.critical-tag{font-size:10px;background:#FDECEA;color:var(--red);padding:1px 6px;border-radius:6px;font-weight:700;margin-left:5px;text-transform:uppercase;}
.ans-wrap{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.ans-btn{width:58px;padding:7px 4px;font-size:11px;font-weight:700;border-radius:6px;border:2px solid transparent;cursor:pointer;text-align:center;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
.a-pass{background:#E8F4EE;color:var(--green);}
.a-pass.active{background:var(--green);color:white;}
.a-fail{background:#FDECEA;color:var(--red);}
.a-fail.active{background:var(--red);color:white;}
.a-na{background:var(--grey4);color:var(--grey2);}
.a-na.active{background:var(--grey3);color:white;}
.fail-note{background:#FDECEA;border-top:1px solid #f5c0bb;padding:10px 16px 10px 88px;}
.fail-note-label{font-size:12px;font-weight:700;color:var(--red);margin-bottom:5px;}
.fail-note-input{width:100%;border:1.5px solid #f5c0bb;border-radius:6px;padding:10px;font-size:13px;font-family:var(--font);resize:none;height:68px;background:white;}
.fail-note-input:focus{outline:none;border-color:var(--red);}

/* TEMPERATURE INPUT */
.temp-input-wrap{background:#E8F4F9;border-top:1px solid var(--aqua);padding:12px 16px;}
.temp-label{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;}
.temp-input{width:120px;border:2px solid var(--blue3);border-radius:8px;padding:10px 14px;font-size:22px;font-weight:700;font-family:var(--font);color:var(--grey1);text-align:center;}
.temp-input:focus{outline:none;}
.temp-unit{font-size:16px;color:var(--grey3);margin-left:6px;}
.temp-alert{background:var(--red);color:white;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px;font-weight:600;line-height:1.5;display:none;}
.temp-alert.show{display:block;}
.temp-alert strong{display:block;font-size:14px;margin-bottom:6px;}

/* SUBMIT BAR */
.submit-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid var(--grey4);padding:10px 16px;z-index:50;}
.submit-btn{width:100%;background:var(--blue);color:white;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:8px;cursor:pointer;transition:background 0.2s;}
.submit-btn:disabled{background:var(--grey3);cursor:not-allowed;}
.submit-note{font-size:11px;color:var(--grey3);text-align:center;margin-top:5px;}

/* COMPLETE SCREEN */
.complete-wrap{padding:28px 20px;text-align:center;}
.complete-icon{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:36px;}
.ci-pass{background:#E8F4EE;color:var(--green);}
.ci-fail{background:#FDECEA;color:var(--red);}
.complete-wrap h2{font-size:22px;font-weight:700;margin-bottom:6px;}
.complete-wrap p{font-size:14px;color:var(--grey2);margin-bottom:24px;}
.summary-card{background:white;border-radius:10px;border:1px solid var(--grey4);overflow:hidden;text-align:left;margin-bottom:20px;}
.summary-row{padding:12px 16px;border-bottom:1px solid var(--grey4);display:flex;justify-content:space-between;font-size:14px;}
.summary-row:last-child{border-bottom:none;}
.sr-label{color:var(--grey2);}
.sr-val{font-weight:700;}
.done-btn{width:100%;background:var(--blue);color:white;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}

/* IMAGE LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain;}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.2);color:white;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lightbox-caption{position:absolute;bottom:20px;left:20px;right:20px;color:white;font-size:14px;text-align:center;background:rgba(0,0,0,0.5);padding:8px 12px;border-radius:8px;}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--grey1);color:white;padding:11px 20px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;transition:all 0.3s;z-index:300;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

      </div>

        <p id="heroLocation"></p>
        <div class="freq-badges" id="heroBadges"></div>
      </div>
    </div>

      <strong>Last checked</strong>
      <span id="lastCheckText"></span>
    </div>

      <label>Full name</label>

    </div>
    <button class="start-btn" id="startBtn" onclick="startCheck()" disabled>Start Check</button>
    <button class="emergency-btn" id="emergencyBtn" onclick="startEmergencyCheck()" style="display:none;">
      ⚠ Post-Emergency Check
    </button>
  </div>
</div>

<!-- SCREEN 2: CHECKLIST -->
<div class="screen" id="screen-check">
  <div class="check-header">
    <h2 id="checkTitle"></h2>
    <p id="checkSubtitle"></p>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 of 0 answered</div>
  </div>
  <div class="main-img-section" id="mainImgSection" style="display:none;">
    <div class="main-img-wrap"><img id="mainImg" src="" alt="Equipment"></div>
    <div class="img-caption-bar"><p id="mainCaption"></p></div>
  </div>
  <div class="checks-body" id="checksBody"></div>
  <div class="submit-bar">
    <button class="submit-btn" id="submitBtn" onclick="submitCheck()" disabled>Submit Check</button>
    <div class="submit-note" id="submitNote">Answer all items to submit</div>
  </div>
</div>

<!-- SCREEN 3: COMPLETE -->
<div class="screen" id="screen-complete">
  <div class="complete-wrap">
    <div class="complete-icon" id="completeIcon"></div>
    <h2 id="completeTitle"></h2>
    <p id="completeMsg"></p>
    <div class="summary-card" id="completeSummary"></div>
    <button class="done-btn" onclick="resetToStart()">Done</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<div class="toast" id="toast"></div>

//  APP STATE
// ============================================================
let currentEquip = null;
let currentEqId = null;
let answers = {};
let failNotes = {};
let tempValues = {};
let staffName = '';
let staffId = "";
let isEmergencyCheck = false;

// ============================================================
//  INIT
// ============================================================
function init() {
  console.log("init() running, EQUIPMENT_DB1 keys:", Object.keys(EQUIPMENT_DB1).length);
  console.log("looking for eq:", new URLSearchParams(window.location.search).get("eq"));
  console.log("found:", EQUIPMENT_DB1[new URLSearchParams(window.location.search).get("eq")] ? "YES" : "NO");
  updateTime();
  setInterval(updateTime, 30000);
  if (CONFIG.supabaseUrl === 'YOUR_SUPABASE_URL') {
    document.getElementById('configNotice').style.display = 'block';
  }
  const params = new URLSearchParams(window.location.search);
  currentEqId = params.get('eq');
  if (!currentEqId || !EQUIPMENT_DB1[currentEqId]) {
    document.getElementById('heroName').textContent = 'Equipment not found';
    document.getElementById('heroLocation').textContent = 'Check QR code and try again';
    return;
  }
  currentEquip = EQUIPMENT_DB1[currentEqId];
  renderHero();
  loadLastCheck(currentEqId);
  document.getElementById('staffName').addEventListener('input', checkCanStart);
  if (currentEquip.afterEmergency) {
    document.getElementById('emergencyBtn').style.display = 'block';
  }
}

function updateTime() {
  const now = new Date();
  document.getElementById('topTime').innerHTML =
    now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + '<br>' +
    now.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function renderHero() {
  const eq = currentEquip;
  const imgWrap = document.getElementById('heroImgWrap');
  if (eq.image) {
    imgWrap.innerHTML = `<img src="${eq.image}" alt="${eq.name}" onerror="this.parentElement.innerHTML='<div class=equip-hero-placeholder><div>🏥</div><p>Photo coming soon</p></div>'">`;
  }
  document.getElementById('heroName').textContent = eq.name;
  document.getElementById('heroLocation').textContent = eq.location;
  const freqMap = {daily:'Daily',weekly:'Weekly',monthly:'Monthly'};
  const freqClass = {daily:'fp-daily',weekly:'fp-weekly',monthly:'fp-monthly'};
  let badges = `<span class="freq-pill ${freqClass[eq.frequency]}">${freqMap[eq.frequency]} check</span>`;
  if (eq.afterEmergency) badges += `<span class="freq-pill fp-emergency">Also after emergency use</span>`;
  document.getElementById('heroBadges').innerHTML = badges;
}

async function loadLastCheck(eqId) {
  if (CONFIG.supabaseUrl === 'YOUR_SUPABASE_URL') return;
  try {
    const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/equipment_checks?equipment_id=eq.${eqId}&order=checked_at.desc&limit=1`, {
      headers:{'apikey':CONFIG.supabaseKey,'Authorization':`Bearer ${CONFIG.supabaseKey}`}
    });
    const data = await res.json();
    if (data && data.length > 0) {
      const last = data[0];
      const t = new Date(last.checked_at);
      document.getElementById('lastCheckText').textContent =
        `${t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} at ${t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} by ${last.staff_name} — ${last.overall_status === 'pass' ? '✓ Passed' : '⚠ Issues recorded'}`;
      document.getElementById('lastCheckBox').style.display = 'block';
    }
  } catch(e) {}
}

function checkCanStart() {
  const ok = document.getElementById('staffName').value.trim().length >= 1;
  document.getElementById('startBtn').disabled = !ok;
}

function startEmergencyCheck() {
  isEmergencyCheck = true;
  staffName = document.getElementById('staffName').value.trim();
  
  if (!staffName) { showToast('Please enter your name first'); return; }
  buildChecklist();
  showScreen('screen-check');
}

function startCheck() {
  console.log("startCheck called, staffName:", document.getElementById("staffName").value, "button disabled:", document.getElementById("startBtn").disabled);
  isEmergencyCheck = false;
  staffName = document.getElementById('staffName').value.trim();
  
  answers = {}; failNotes = {}; tempValues = {};
  buildChecklist();
  showScreen('screen-check');
}

// ============================================================
//  BUILD CHECKLIST
// ============================================================
function buildChecklist() {

  const eq = currentEquip;
  document.getElementById('checkTitle').textContent = eq.name + (isEmergencyCheck ? ' — Post-Emergency' : '');
  document.getElementById('checkSubtitle').textContent = `${staffName} · ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
  if (eq.image) {
    document.getElementById('mainImg').src = eq.image;
    document.getElementById('mainCaption').textContent = eq.imageCaption || '';
    document.getElementById('mainImgSection').style.display = 'block';
  }

  let html = '';
  eq.categories.forEach(cat => {
    html += `<div class="cat-header"><div class="cat-icon">${cat.icon}</div>${cat.name}</div>`;
    cat.items.forEach(item => {
      const hasImg = item.image;
      const imgHtml = hasImg
        ? `<div class="item-img-thumb" onclick="openLightbox('${item.image}','${item.name}')"><img src="${item.image}" alt="${item.name}" onerror="this.parentElement.innerHTML='<div class=item-img-placeholder>📷</div>'"><div class="item-img-expand">🔍</div></div>`
        : `<div class="item-img-thumb"><div class="item-img-placeholder">📷</div></div>`;
      html += `
        <div class="item-wrap${item.critical?' critical':''}" id="wrap-${item.id}">
          <div class="item-row">
            ${imgHtml}
            <div class="item-text">
              <div class="item-name">${item.name}${item.critical?'<span class="critical-tag">Critical</span>':''}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
            <div class="ans-wrap">
              <button class="ans-btn a-pass" id="pass-${item.id}" onclick="setAns('${item.id}','pass')">✓ Pass</button>
              <button class="ans-btn a-fail" id="fail-${item.id}" onclick="setAns('${item.id}','fail')">✗ Fail</button>
              <button class="ans-btn a-na" id="na-${item.id}" onclick="setAns('${item.id}','na')">N/A</button>
            </div>
          </div>`;

      // Temperature input for temp check items
      if (item.temperatureInput || (currentEquip.temperatureCheck && item.id.includes('temp_recorded'))) {
        html += `
          <div class="temp-input-wrap">
            <div class="temp-label">Enter temperature reading:</div>
            <input class="temp-input" type="number" step="0.1" id="temp-${item.id}" placeholder="00.0" oninput="checkTemp('${item.id}',this.value)">
            <span class="temp-unit">${currentEquip.tempUnit || '°C'}</span>
            <div class="temp-alert" id="tempalert-${item.id}">
              <strong>⚠ Temperature outside 2–8°C range — action required</strong>
              <div id="tempescalation-${item.id}"></div>
            </div>
          </div>`;
      }

      html += `
          <div class="fail-note" id="fnote-${item.id}" style="display:none;">
            <div class="fail-note-label">⚠ Describe the fault (required before submitting):</div>
            <textarea class="fail-note-input" id="fnotetxt-${item.id}" placeholder="Describe what was found and any action taken..." oninput="updateSubmit()"></textarea>
          </div>
        </div>`;
    });
  });

  try {
    document.getElementById('checksBody').innerHTML = html;
    console.log("checksBody set, length:", document.getElementById('checksBody').innerHTML.length, "children:", document.getElementById('checksBody').children.length);
    updateProgress();
  } catch(buildErr) {
    console.error('buildChecklist error:', buildErr.message, buildErr.stack);
    document.getElementById('checksBody').innerHTML = '<div style="padding:20px;color:red;">Error loading checklist: ' + buildErr.message + '</div>';
  }
}

function checkTemp(itemId, val) {
  const temp = parseFloat(val);
  const alertEl = document.getElementById(`tempalert-${itemId}`);
  const escEl = document.getElementById(`tempescalation-${itemId}`);
  // Fridge items use 2-8°C range, area temp items use max threshold
  const isFridgeItem = itemId.includes('fridge') || itemId.includes('_temp_recorded_');
  let outOfRange = false;
  if (isFridgeItem) {
    outOfRange = !isNaN(temp) && (temp < 2 || temp > 8);
  } else {
    const max = currentEquip.tempMax || 25;
    outOfRange = !isNaN(temp) && temp >= max;
  }
  if (outOfRange) {
    const esc = currentEquip.escalation;
    if(escEl) escEl.innerHTML = esc ? `<p style="margin-bottom:6px">${esc.immediate||''}</p><p style="margin-bottom:6px">${esc.outOfRange||''}</p><p>${esc.contactPharmacy||''}</p>` : '';
    if(alertEl) alertEl.classList.add('show');
    setAns(itemId, 'fail');
  } else if (!isNaN(temp)) {
    if(alertEl) alertEl.classList.remove('show');
    setAns(itemId, 'pass');
  }
  tempValues[itemId] = val;
}

function setAns(itemId, ans) {
  answers[itemId] = ans;
  ['pass','fail','na'].forEach(a => {
    const el = document.getElementById(`${a}-${itemId}`);
    if(el) el.classList.toggle('active', a === ans);
  });
  const fnote = document.getElementById(`fnote-${itemId}`);
  if(fnote) fnote.style.display = ans === 'fail' ? 'block' : 'none';
  if(ans !== 'fail') delete failNotes[itemId];
  updateProgress();
  updateSubmit();
}

function getAllItems() {
  const items = [];
  currentEquip.categories.forEach(c => c.items.forEach(i => items.push(i)));
  return items;
}

function updateProgress() {
  const items = getAllItems();
  const done = items.filter(i => answers[i.id]).length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} of ${items.length} answered`;
}

function updateSubmit() {
  const items = getAllItems();
  const allAnswered = items.every(i => answers[i.id]);
  const failsMissingNotes = items.filter(i => answers[i.id]==='fail').some(i => {
    const el = document.getElementById(`fnotetxt-${i.id}`);
    return el && !el.value.trim();
  });
  const canSubmit = allAnswered && !failsMissingNotes;
  document.getElementById('submitBtn').disabled = !canSubmit;
  if (!allAnswered) document.getElementById('submitNote').textContent = 'Answer all items to submit';
  else if (failsMissingNotes) document.getElementById('submitNote').textContent = 'Add fault notes for all failed items';
  else document.getElementById('submitNote').textContent = 'All items answered — ready to submit';
}

//  SUBMIT

// ── AUTO-DAILY MAP ──────────────────────────────────────
// When a monthly/weekly check is submitted, also register the daily check
const AUTO_DAILY_MAP = {
  'resuscitaire_1_monthly': 'resuscitaire_1_daily',
  'resuscitaire_2_monthly': 'resuscitaire_2_daily',
  'resuscitaire_3_monthly': 'resuscitaire_3_daily',
  'resuscitaire_4_monthly': 'resuscitaire_4_daily',
  'resuscitaire_5_monthly': 'resuscitaire_5_daily',
  'resuscitaire_6_monthly': 'resuscitaire_6_daily',
  'resuscitaire_7_monthly': 'resuscitaire_7_daily',
  'resuscitaire_8_monthly': 'resuscitaire_8_daily',
  'resuscitaire_9_monthly': 'resuscitaire_9_daily',
  'pph_trolley_1_monthly': 'pph_trolley_1_daily',
  'pph_trolley_2_monthly': 'pph_trolley_2_daily',
  'instrumental_trolley_1_monthly': 'instrumental_trolley_1_daily',
  'instrumental_trolley_2_monthly': 'instrumental_trolley_2_daily',
  'emergency_trolley_monthly': 'emergency_trolley_daily',
  'transfer_bag_handover_monthly': 'transfer_bag_handover_daily',
  'transfer_bag_triage_monthly': 'transfer_bag_triage_daily',
  'sepsis_box_monthly': 'sepsis_box_daily',
  'hypo_box_weekly': 'hypo_box_daily',
  'cpr_trolley_weekly': 'cpr_trolley_daily',
};

async function submitCheck() {
  const items = getAllItems();
  items.forEach(i => {
    if(answers[i.id]==='fail') {
      const el = document.getElementById(`fnotetxt-${i.id}`);
      if(el) failNotes[i.id] = el.value.trim();
    }
  });

  const passCount = items.filter(i=>answers[i.id]==='pass').length;
  const failCount = items.filter(i=>answers[i.id]==='fail').length;
  const naCount   = items.filter(i=>answers[i.id]==='na').length;
  const critFails = items.filter(i=>i.critical&&answers[i.id]==='fail').map(i=>i.name);
  const overall = failCount > 0 ? 'fail' : 'pass';

  const payload = {
    equipment_id: currentEqId,
    equipment_name: currentEquip.name,
    location: currentEquip.location,
    frequency: currentEquip.frequency,
    staff_name: staffName,
    staff_id: staffId,
    checked_at: new Date().toISOString(),
    overall_status: overall,
    pass_count: passCount,
    fail_count: failCount,
    na_count: naCount,
    critical_fails: critFails,
    answers,
    fail_notes: failNotes,
    temperature_values: tempValues,
    is_post_emergency: isEmergencyCheck,
    ward: CONFIG.ward
  };

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Submitting...';

  let saved = false;
  if (CONFIG.supabaseUrl !== 'YOUR_SUPABASE_URL') {
    try {
      const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/equipment_checks`, {
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':CONFIG.supabaseKey,'Authorization':`Bearer ${CONFIG.supabaseKey}`,'Prefer':'return=minimal'},
        body: JSON.stringify(payload)
      });
      saved = res.ok;
    } catch(e) { console.error(e); }
  }

  // Always save locally as offline backup
  try {
    const local = JSON.parse(localStorage.getItem('sm_lwec_checks') || '[]');
    local.unshift({...payload, _savedToCloud: saved});
    if(local.length > 1000) local.splice(1000);
    localStorage.setItem('sm_lwec_checks', JSON.stringify(local));
  } catch(e) {}

  // Auto-register daily check if this is a monthly/weekly check
  const dailyId = AUTO_DAILY_MAP[currentEqId];
  if(dailyId && saved) {
    try {
      const dailyPayload = {...payload, equipment_id: dailyId, frequency: 'daily'};
      await fetch(`${CONFIG.supabaseUrl}/rest/v1/equipment_checks`, {
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':CONFIG.supabaseKey,'Authorization':`Bearer ${CONFIG.supabaseKey}`,'Prefer':'return=minimal'},
        body: JSON.stringify(dailyPayload)
      });
    } catch(e) { console.error('Auto-daily save failed:', e); }
  }

  showComplete(overall, passCount, failCount, naCount, critFails, saved);
}

function showComplete(status, pass, fail, na, critFails, saved) {
  const icon = document.getElementById('completeIcon');
  icon.className = `complete-icon ${status==='pass'?'ci-pass':'ci-fail'}`;
  icon.textContent = status==='pass' ? '✓' : '⚠';
  document.getElementById('completeTitle').textContent = status==='pass' ? 'Check Complete — All Clear' : 'Check Complete — Issues Recorded';
  document.getElementById('completeMsg').textContent = status==='pass'
    ? 'All items checked and passed. Equipment is ready for use.'
    : `${fail} item${fail>1?'s':''} failed. Notify the shift lead immediately before use.`;

  let html = `
    <div class="summary-row"><span class="sr-label">Equipment</span><span class="sr-val">${currentEquip.name}</span></div>
    <div class="summary-row"><span class="sr-label">Checked by</span><span class="sr-val">${staffName}</span></div>
    <div class="summary-row"><span class="sr-label">Time</span><span class="sr-val">${new Date().toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
    <div class="summary-row"><span class="sr-label">Passed</span><span class="sr-val" style="color:var(--green)">${pass}</span></div>`;
  if(fail>0) html += `<div class="summary-row"><span class="sr-label">Failed</span><span class="sr-val" style="color:var(--red)">${fail}</span></div>`;
  if(critFails.length>0) html += `<div class="summary-row" style="flex-direction:column;gap:6px;"><span class="sr-label" style="color:var(--red);font-weight:700;">⚠ Critical failures</span><span style="font-size:13px;">${critFails.join(', ')}</span></div>`;
  if(isEmergencyCheck) html += `<div class="summary-row"><span class="sr-label">Check type</span><span class="sr-val" style="color:var(--red)">Post-emergency</span></div>`;
  html += `<div class="summary-row"><span class="sr-label">Data saved</span><span class="sr-val" style="color:${saved?'var(--green)':'var(--amber)'}">${saved?'✓ Cloud + Local':'Local only (offline)'}</span></div>`;

  document.getElementById('completeSummary').innerHTML = html;
  showScreen('screen-complete');
}

function resetToStart() {
  answers={}; failNotes={}; tempValues={}; isEmergencyCheck=false;
  document.getElementById('staffName').value='';
  document.getElementById('startBtn').disabled=true;

}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

init();
</script>
